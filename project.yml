name: NetworkSpeedBar

options:
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    macOS: "13.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.zhangdashu.NetworkSpeedBar
    PRODUCT_NAME: NetworkSpeedBar
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: NetworkSpeedBar/Resources/Info.plist
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0

targets:
  NetworkSpeedBar:
    type: application
    platform: macOS
    sources:
      - path: NetworkSpeedBar
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_MODULE_NAME: NetworkSpeedBar
        SWIFT_EMIT_LOC_STRINGS: NO
    scheme:
      gatherCoverageData: false
